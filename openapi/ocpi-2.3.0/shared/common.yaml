# OCPI 2.3.0 - Shared Components
# Common types, enums, and response wrapper used across all modules
openapi: 3.1.0
info:
  title: OCPI 2.3.0 - Shared Components
  version: 2.3.0
  description: Shared data types and schemas for OCPI 2.3.0

paths: {}

components:
  responses:
    OcpiConfigurationBadRequestResponse:
      description: Invalid request or malformed OCPI payload for a configuration module.
      headers:
        X-Request-ID:
          $ref: ./headers.yaml#/components/headers/X-Request-ID
        X-Correlation-ID:
          $ref: ./headers.yaml#/components/headers/X-Correlation-ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OcpiResponse'
    OcpiBadRequestResponse:
      description: Invalid request or malformed OCPI payload.
      headers:
        X-Request-ID:
          $ref: ./headers.yaml#/components/headers/X-Request-ID
        X-Correlation-ID:
          $ref: ./headers.yaml#/components/headers/X-Correlation-ID
        OCPI-from-country-code:
          $ref: ./headers.yaml#/components/headers/OCPI-from-country-code
        OCPI-from-party-id:
          $ref: ./headers.yaml#/components/headers/OCPI-from-party-id
        OCPI-to-country-code:
          $ref: ./headers.yaml#/components/headers/OCPI-to-country-code
        OCPI-to-party-id:
          $ref: ./headers.yaml#/components/headers/OCPI-to-party-id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OcpiResponse'
    OcpiNotFoundResponse:
      description: The requested OCPI resource was not found.
      headers:
        X-Request-ID:
          $ref: ./headers.yaml#/components/headers/X-Request-ID
        X-Correlation-ID:
          $ref: ./headers.yaml#/components/headers/X-Correlation-ID
        OCPI-from-country-code:
          $ref: ./headers.yaml#/components/headers/OCPI-from-country-code
        OCPI-from-party-id:
          $ref: ./headers.yaml#/components/headers/OCPI-from-party-id
        OCPI-to-country-code:
          $ref: ./headers.yaml#/components/headers/OCPI-to-country-code
        OCPI-to-party-id:
          $ref: ./headers.yaml#/components/headers/OCPI-to-party-id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OcpiResponse'
    OcpiUnauthorizedResponse:
      description: The credentials token is missing, invalid, or unauthorized.
      headers:
        X-Request-ID:
          $ref: ./headers.yaml#/components/headers/X-Request-ID
        X-Correlation-ID:
          $ref: ./headers.yaml#/components/headers/X-Correlation-ID
        OCPI-from-country-code:
          $ref: ./headers.yaml#/components/headers/OCPI-from-country-code
        OCPI-from-party-id:
          $ref: ./headers.yaml#/components/headers/OCPI-from-party-id
        OCPI-to-country-code:
          $ref: ./headers.yaml#/components/headers/OCPI-to-country-code
        OCPI-to-party-id:
          $ref: ./headers.yaml#/components/headers/OCPI-to-party-id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OcpiResponse'
  schemas:
    # ---- Response Wrapper ----

    OcpiResponse:
      type: object
      description: Standard OCPI response envelope wrapping all API responses.
      required:
        - status_code
        - timestamp
      properties:
        data: {}
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: true

    OcpiResponseData:
      description: OCPI response with a single object in data field.
      allOf:
        - $ref: '#/components/schemas/OcpiResponse'
        - type: object
          properties:
            data:
              type: object

    OcpiResponseDataList:
      description: OCPI response with an array of objects in data field.
      allOf:
        - $ref: '#/components/schemas/OcpiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object

    OcpiResponseString:
      description: OCPI response with a string in data field.
      allOf:
        - $ref: '#/components/schemas/OcpiResponse'
        - type: object
          properties:
            data:
              type: string

    # ---- Primitive Types ----

    DateTime:
      type: string
      maxLength: 25
      pattern: '^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?Z?$'
      description: >-
        Timestamp formatted as an OCPI-restricted RFC 3339 string in UTC. The UTC
        designator Z is optional, fractional seconds MAY be used, and offsets such
        as +00:00 are not allowed.
      example: "2024-01-15T10:30:00Z"

    CiString:
      type: string
      description: Case Insensitive String. Only printable ASCII allowed.

    # ---- Shared Classes ----

    DisplayText:
      type: object
      description: Multi-language text with a language code.
      required:
        - language
        - text
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 2
          description: Language Code ISO 639-1.
        text:
          type: string
          maxLength: 512
          description: Text to be displayed to an end user. No markup, HTML etc. allowed.
      additionalProperties: true

    Price:
      type: object
      description: Price with taxes breakdown.
      required:
        - before_taxes
      properties:
        before_taxes:
          type: number
          description: Price/Cost excluding taxes.
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxAmount'
          description: All taxes applicable to this price.
      additionalProperties: true

    TaxAmount:
      type: object
      description: Breakdown of a single tax applicable to a price.
      required:
        - name
        - amount
      properties:
        name:
          type: string
          description: >-
            A description of the tax (e.g. "QST", "VAT", "General Sales Tax").
        account_number:
          type: string
          description: Tax Account Number of the business entity remitting these taxes.
        percentage:
          type: number
          description: Tax percentage.
        amount:
          type: number
          description: The amount of money of this tax that is due.
      additionalProperties: true

    GeoLocation:
      type: object
      description: Geographic coordinates (WGS 84).
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: string
          maxLength: 10
          description: Latitude in decimal degree (e.g. "50.770774").
          pattern: "^-?[0-9]{1,2}\\.[0-9]{5,7}$"
        longitude:
          type: string
          maxLength: 11
          description: Longitude in decimal degree (e.g. "-126.104965").
          pattern: "^-?[0-9]{1,3}\\.[0-9]{5,7}$"
      additionalProperties: true

    AdditionalGeoLocation:
      type: object
      description: An additional geographic location with an optional human-readable name.
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: string
          maxLength: 10
          pattern: "^-?[0-9]{1,2}\\.[0-9]{5,7}$"
          description: Latitude in decimal degree.
        longitude:
          type: string
          maxLength: 11
          pattern: "^-?[0-9]{1,3}\\.[0-9]{5,7}$"
          description: Longitude in decimal degree.
        name:
          $ref: '#/components/schemas/DisplayText'
      additionalProperties: true

    BusinessDetails:
      type: object
      description: Details of an operator, owner, or suboperator.
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          description: Name of the operator/owner/suboperator.
        website:
          type: string
          format: uri
          maxLength: 255
          description: Link to website of the operator.
        logo:
          $ref: '#/components/schemas/Image'
      additionalProperties: true

    Image:
      type: object
      description: Reference to an image with metadata.
      required:
        - url
        - category
        - type
      properties:
        url:
          type: string
          format: uri
          maxLength: 255
          description: URL from where the image data can be fetched.
        thumbnail:
          type: string
          format: uri
          maxLength: 255
          description: URL from where a thumbnail of the image can be fetched.
        category:
          $ref: '#/components/schemas/ImageCategory'
        type:
          type: string
          maxLength: 4
          description: Image type (e.g. gif, jpeg, png, svg).
        width:
          type: integer
          description: Width of the full-scale image.
        height:
          type: integer
          description: Height of the full-scale image.
      additionalProperties: true

    Hours:
      type: object
      description: Opening and access hours.
      required:
        - twentyfourseven
      properties:
        twentyfourseven:
          type: boolean
          description: True to represent 24/7, with the exception of the optional exceptional_openings/closings.
        regular_hours:
          type: array
          items:
            $ref: '#/components/schemas/RegularHours'
          description: Regular hours, weekday-based. Only to be used if twentyfourseven is false.
        exceptional_openings:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionalPeriod'
          description: Exceptions for specified calendar dates when the EVSE is operating.
        exceptional_closings:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionalPeriod'
          description: Exceptions for specified calendar dates when the EVSE is not operating.
      additionalProperties: true

    RegularHours:
      type: object
      description: Regular recurring operation or access hours.
      required:
        - weekday
        - period_begin
        - period_end
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: Day of the week, 1=Monday, 7=Sunday.
        period_begin:
          type: string
          maxLength: 5
          pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
          description: Begin of the regular period (HH:MM, 24h format).
        period_end:
          type: string
          maxLength: 5
          pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
          description: End of the regular period (HH:MM, 24h format).
      additionalProperties: true

    ExceptionalPeriod:
      type: object
      description: Specifies one exceptional period for operating hours.
      required:
        - period_begin
        - period_end
      properties:
        period_begin:
          $ref: '#/components/schemas/DateTime'
        period_end:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: true

    EnergyMix:
      type: object
      description: Details about the energy supplied at this location.
      required:
        - is_green_energy
      properties:
        is_green_energy:
          type: boolean
          description: True if 100% from regenerative sources.
        energy_sources:
          type: array
          items:
            $ref: '#/components/schemas/EnergySource'
          description: Key-value pairs of energy sources.
        environ_impact:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentalImpact'
          description: Key-value pairs of environmental impact values.
        supplier_name:
          type: string
          maxLength: 64
          description: Name of the energy supplier.
        energy_product_name:
          type: string
          maxLength: 64
          description: Name of the energy product/tariff.
      additionalProperties: true

    EnergySource:
      type: object
      description: Breakdown of energy from a specific source.
      required:
        - source
        - percentage
      properties:
        source:
          $ref: '#/components/schemas/EnergySourceCategory'
        percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Percentage of this source in the energy mix (0-100).
      additionalProperties: true

    EnvironmentalImpact:
      type: object
      description: Amount of environmental waste produced.
      required:
        - category
        - amount
      properties:
        category:
          $ref: '#/components/schemas/EnvironmentalImpactCategory'
        amount:
          type: number
          description: Amount of this environmental impact in g/kWh.
      additionalProperties: true

    # ---- Shared Enums ----

    Role:
      type: string
      enum:
        - CPO
        - EMSP
        - NAP
        - NSP
        - OTHER
        - SCSP
      description: The role of a party in the EV charging ecosystem.
      x-enumDescriptions:
        CPO: Charge Point Operator Role.
        EMSP: eMobility Service Provider Role.
        NAP: National Access Point Role (national Database with all Location information of a country).
        NSP: "Navigation Service Provider Role, role like an eMSP (probably only interested in Location information)."
        OTHER: Other role.
        SCSP: Smart Charging Service Provider Role.

    ImageCategory:
      anyOf:
        - type: string
          enum:
            - CHARGER
            - ENTRANCE
            - LOCATION
            - NETWORK
            - OPERATOR
            - OTHER
            - OWNER
        - type: string
      description: The category of an image to obtain the correct usage.
      x-enumDescriptions:
        CHARGER: Photo of the physical device that contains one or more EVSEs.
        ENTRANCE: Location entrance photo. Should show the car entrance to the location from street side.
        LOCATION: Location overview photo.
        NETWORK: Logo of an associated roaming network to be displayed with the EVSE for example in lists, maps and detailed information views.
        OPERATOR: Logo of the charge point operator, for example a municipality, to be displayed in the EVSEs detailed information view or in lists and maps, if no network logo is present.
        OTHER: Other
        OWNER: Logo of the charge point owner, for example a local store, to be displayed in the EVSEs detailed information view.

    EnergySourceCategory:
      type: string
      enum:
        - NUCLEAR
        - GENERAL_FOSSIL
        - COAL
        - GAS
        - GENERAL_GREEN
        - SOLAR
        - WIND
        - WATER
      description: Categories of energy sources.
      x-enumDescriptions:
        NUCLEAR: Nuclear power sources.
        GENERAL_FOSSIL: All kinds of fossil power sources.
        COAL: Fossil power from coal.
        GAS: Fossil power from gas.
        GENERAL_GREEN: All kinds of regenerative power sources.
        SOLAR: Regenerative power from PV.
        WIND: Regenerative power from wind turbines.
        WATER: Regenerative power from water turbines.


    EnvironmentalImpactCategory:
      anyOf:
        - type: string
          enum:
            - NUCLEAR_WASTE
            - CARBON_DIOXIDE
        - type: string
      description: Categories of environmental impact values.
      x-enumDescriptions:
        NUCLEAR_WASTE: Produced nuclear waste in grams per kilowatthour.
        CARBON_DIOXIDE: Exhausted carbon dioxide in grams per kilowatthour.
