openapi: 3.1.0
info:
  title: OCPI 2.3.0 - Commands
  description: The Commands module enables remote commands from eMSP to CPO, such
    as starting/stopping sessions, reservations, and unlocking connectors. Uses async
    callbacks via response_url.
  version: 2.3.0
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.3.0 Specification
  url: https://github.com/ocpi/ocpi
servers:
- url: https://example.com/ocpi/2.3.0
  description: Example OCPI server
security:
- TokenAuth: []
paths:
  /commands/{command}:
    post:
      operationId: postExtendedCommand
      summary: Send an extended command (Receiver)
      description: >-
        Send a custom command identified by an extended CommandType value. The five
        standard commands remain documented on their literal paths with their specific
        request schemas.
      tags:
      - Commands - Receiver
      parameters:
      - name: command
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CommandType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Payload defined by the parties that agreed on the extended command.
      responses:
        '200':
          description: Command acknowledged by CPO.
          headers:
            X-Request-ID:
              $ref: ./shared/headers.yaml#/components/headers/X-Request-ID
            X-Correlation-ID:
              $ref: ./shared/headers.yaml#/components/headers/X-Correlation-ID
            # Routing headers
            OCPI-from-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-country-code
            OCPI-from-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-party-id
            OCPI-to-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-country-code
            OCPI-to-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-party-id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelopeResponse'
        '400':
          $ref: ./shared/common.yaml#/components/responses/OcpiBadRequestResponse
        '401':
          $ref: ./shared/common.yaml#/components/responses/OcpiUnauthorizedResponse
    parameters:
    - $ref: ./shared/headers.yaml#/components/parameters/X-Request-ID
    - $ref: ./shared/headers.yaml#/components/parameters/X-Correlation-ID
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-country-code
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-party-id
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-country-code
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-party-id
  /commands/CANCEL_RESERVATION:
    post:
      operationId: postCancelReservation
      summary: Cancel Reservation (Receiver)
      description: Request the Charge Point to cancel a specific reservation.
      tags:
      - Commands - Receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservation'
      responses:
        '200':
          description: Command acknowledged by CPO.
          headers:
            # Correlation headers
            X-Request-ID:
              $ref: ./shared/headers.yaml#/components/headers/X-Request-ID
            X-Correlation-ID:
              $ref: ./shared/headers.yaml#/components/headers/X-Correlation-ID
            # Routing headers
            OCPI-from-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-country-code
            OCPI-from-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-party-id
            OCPI-to-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-country-code
            OCPI-to-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-party-id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelopeResponse'
        '400':
          $ref: ./shared/common.yaml#/components/responses/OcpiBadRequestResponse
        '401':
          $ref: ./shared/common.yaml#/components/responses/OcpiUnauthorizedResponse
      callbacks:
        commandResult:
          '{$request.body#/response_url}':
            post:
              summary: Async result from Charge Point
              description: The CPO sends the actual result from the Charge Point to
                the eMSP's response_url.
              parameters:
              # Correlation headers
              - $ref: ./shared/headers.yaml#/components/parameters/X-Request-ID
              - $ref: ./shared/headers.yaml#/components/parameters/X-Correlation-ID
              # Routing headers
              - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-country-code
              - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-party-id
              - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-country-code
              - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-party-id
              security:
              - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CommandResult'
              responses:
                '200':
                  description: Result received.
                  headers:
                    # Correlation headers
                    X-Request-ID:
                      $ref: ./shared/headers.yaml#/components/headers/X-Request-ID
                    X-Correlation-ID:
                      $ref: ./shared/headers.yaml#/components/headers/X-Correlation-ID
                    # Routing headers
                    OCPI-from-country-code:
                      $ref: ./shared/headers.yaml#/components/headers/OCPI-from-country-code
                    OCPI-from-party-id:
                      $ref: ./shared/headers.yaml#/components/headers/OCPI-from-party-id
                    OCPI-to-country-code:
                      $ref: ./shared/headers.yaml#/components/headers/OCPI-to-country-code
                    OCPI-to-party-id:
                      $ref: ./shared/headers.yaml#/components/headers/OCPI-to-party-id
                  content:
                    application/json:
                      schema:
                        $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
                '400':
                  $ref: ./shared/common.yaml#/components/responses/OcpiBadRequestResponse
                '401':
                  $ref: ./shared/common.yaml#/components/responses/OcpiUnauthorizedResponse
    parameters:
    # Correlation headers
    - $ref: ./shared/headers.yaml#/components/parameters/X-Request-ID
    - $ref: ./shared/headers.yaml#/components/parameters/X-Correlation-ID
    # Routing headers
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-country-code
