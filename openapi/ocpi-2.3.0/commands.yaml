webhooks:
  commandResult:
    post:
      operationId: postCommandResult
      summary: Receive async CommandResult (Sender)
      description: The Sender (typically eMSP) implements this webhook to receive
        the async CommandResult from the CPO via POST to the response_url provided
        in the original command request.
      tags:
      - Commands - Sender
      parameters:
      # Correlation headers
      - $ref: ./shared/headers.yaml#/components/parameters/X-Request-ID
      - $ref: ./shared/headers.yaml#/components/parameters/X-Correlation-ID
      # Routing headers
      - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-country-code
      - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-party-id
      - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-country-code
      - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-party-id
      security:
      - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandResult'
      responses:
        '200':
          description: Result received.
          headers:
            # Correlation headers
            X-Request-ID:
              $ref: ./shared/headers.yaml#/components/headers/X-Request-ID
            X-Correlation-ID:
              $ref: ./shared/headers.yaml#/components/headers/X-Correlation-ID
            # Routing headers
            OCPI-from-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-country-code
            OCPI-from-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-party-id
            OCPI-to-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-country-code
            OCPI-to-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-party-id
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        '400':
          $ref: ./shared/common.yaml#/components/responses/OcpiBadRequestResponse
        '401':
          $ref: ./shared/common.yaml#/components/responses/OcpiUnauthorizedResponse
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed as `Token <base64-encoded-credentials-token>` in the Authorization header.
  schemas:
    CommandType:
      anyOf:
      - type: string
        enum:
        - CANCEL_RESERVATION
        - RESERVE_NOW
        - START_SESSION
        - STOP_SESSION
        - UNLOCK_CONNECTOR
      - type: string
      description: Open command type. Parties may agree on additional command values.
      x-enumDescriptions:
        CANCEL_RESERVATION: Request the Charge Point to cancel a specific reservation.
        RESERVE_NOW: Request the Charge Point to reserve a specific EVSE for a Token for a certain time, starting now.
        START_SESSION: Request the Charge Point to start a transaction on the given EVSE or Connector.
        STOP_SESSION: Request the Charge Point to stop an ongoing session.
        UNLOCK_CONNECTOR: Request the Charge Point to unlock the connector, if applicable.
    CommandEnvelopeResponse:
      type: object
      required:
      - status_code
      - timestamp
      - data
      properties:
        data:
          $ref: '#/components/schemas/CommandResponse'
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    CancelReservation:
      type: object
      description: Request to cancel a reservation.
      required:
      - response_url
      - reservation_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to.
        reservation_id:
          type: string
          maxLength: 36
          description: Unique reservation ID to cancel.
      additionalProperties: true
    ReserveNow:
      type: object
      description: Request to reserve an EVSE for a Token.
      required:
      - response_url
      - token
      - expiry_date
      - reservation_id
      - location_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to.
        token:
          $ref: ./tokens.yaml#/components/schemas/Token
        expiry_date:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        reservation_id:
          type: string
          maxLength: 36
          description: Unique reservation ID.
        location_id:
          type: string
          maxLength: 36
          description: Location.id of the Location to reserve at.
        evse_uid:
          type: string
          maxLength: 36
          description: Optional EVSE.uid of the specific EVSE to reserve.
        authorization_reference:
          type: string
          maxLength: 36
          description: Reference to the authorization given by the eMSP.
      additionalProperties: true
    StartSession:
      type: object
      description: Request to start a charging session.
      required:
      - response_url
      - token
      - location_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to.
        token:
          $ref: ./tokens.yaml#/components/schemas/Token
        location_id:
          type: string
          maxLength: 36
          description: Location.id of the Location to start charging at.
        evse_uid:
          type: string
          maxLength: 36
          description: Optional EVSE.uid. Required when connector_id is set.
        connector_id:
          type: string
          maxLength: 36
          description: Optional Connector.id. Required when START_SESSION_CONNECTOR_REQUIRED
            capability is set.
        authorization_reference:
          type: string
          maxLength: 36
          description: Reference to the authorization given by the eMSP.
      additionalProperties: true
    StopSession:
      type: object
      description: Request to stop an ongoing charging session.
      required:
      - response_url
      - session_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to.
        session_id:
          type: string
          maxLength: 36
          description: Session.id of the Session to stop.
      additionalProperties: true
    UnlockConnector:
      type: object
      description: Request to unlock a connector (for help desk operators).
      required:
      - response_url
      - location_id
      - evse_uid
      - connector_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to.
        location_id:
          type: string
          maxLength: 36
          description: Location.id of the Location.
        evse_uid:
          type: string
          maxLength: 36
          description: EVSE.uid of the EVSE.
        connector_id:
          type: string
          maxLength: 36
          description: Connector.id of the Connector to unlock.
      additionalProperties: true
    CommandResponse:
      type: object
      description: Immediate response from CPO indicating whether the command was
        understood and forwarded (not the result from the Charge Point itself).
      required:
      - result
      - timeout
      properties:
        result:
          $ref: '#/components/schemas/CommandResponseType'
        timeout:
          type: integer
          description: Timeout in seconds for waiting for the async CommandResult.
        message:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
          description: Human-readable description of the result.
      additionalProperties: true
    CommandResult:
      type: object
      description: Asynchronous result from the Charge Point, sent via POST to the
        response_url.
      required:
      - result
      properties:
        result:
          $ref: '#/components/schemas/CommandResultType'
        message:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
          description: Human-readable description of the result.
      additionalProperties: true
    CommandResponseType:
      type: string
      enum:
      - NOT_SUPPORTED
      - REJECTED
      - ACCEPTED
      - UNKNOWN_SESSION
      description: Response from the CPO on the command request.
      x-enumDescriptions:
        NOT_SUPPORTED: The requested command is not supported by this CPO, Charge Point, EVSE etc.
        REJECTED: Command request rejected by the CPO. (Session might not be from a customer of the eMSP that sent this request)
        ACCEPTED: Command request accepted by the CPO.
        UNKNOWN_SESSION: The Session in the requested command is not known by this CPO.


    CommandResultType:
      type: string
      enum:
      - ACCEPTED
      - CANCELED_RESERVATION
      - EVSE_OCCUPIED
      - EVSE_INOPERATIVE
      - FAILED
      - NOT_SUPPORTED
      - REJECTED
      - TIMEOUT
      - UNKNOWN_RESERVATION
      description: Result of the command as reported by the Charge Point.
      x-enumDescriptions:
        ACCEPTED: Command request accepted by the Charge Point.
        CANCELED_RESERVATION: The Reservation has been canceled by the CPO.
        EVSE_OCCUPIED: EVSE is currently occupied, another session is ongoing. Cannot start a new session.
        EVSE_INOPERATIVE: EVSE is currently inoperative or faulted.
        FAILED: Execution of the command failed at the Charge Point.
        NOT_SUPPORTED: The requested command is not supported by this Charge Point, EVSE etc.
        REJECTED: Command request rejected by the Charge Point.
        TIMEOUT: Command request timeout, no response received from the Charge Point in a reasonable time.
        UNKNOWN_RESERVATION: The Reservation in the requested command is not known by this Charge Point.
