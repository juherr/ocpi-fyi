            # Routing headers
            OCPI-from-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-country-code
            OCPI-from-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-from-party-id
            OCPI-to-country-code:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-country-code
            OCPI-to-party-id:
              $ref: ./shared/headers.yaml#/components/headers/OCPI-to-party-id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAdviceConfirmationResponse'
        '400':
          $ref: ./shared/common.yaml#/components/responses/OcpiBadRequestResponse
        '401':
          $ref: ./shared/common.yaml#/components/responses/OcpiUnauthorizedResponse
        '404':
          $ref: ./shared/common.yaml#/components/responses/OcpiNotFoundResponse
    parameters:
    # Correlation headers
    - $ref: ./shared/headers.yaml#/components/parameters/X-Request-ID
    - $ref: ./shared/headers.yaml#/components/parameters/X-Correlation-ID
    # Routing headers
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-country-code
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-from-party-id
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-country-code
    - $ref: ./shared/headers.yaml#/components/parameters/OCPI-to-party-id
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed as `Token <base64-encoded-credentials-token>` in the Authorization header.
  schemas:
    TerminalResponse:
      type: object
      required:
      - status_code
      - timestamp
      - data
      properties:
        data:
          $ref: '#/components/schemas/Terminal'
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    TerminalListResponse:
      type: object
      required:
      - status_code
      - timestamp
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Terminal'
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    FinancialAdviceConfirmationResponse:
      type: object
      required:
      - status_code
      - timestamp
      - data
      properties:
        data:
          $ref: '#/components/schemas/FinancialAdviceConfirmation'
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    FinancialAdviceConfirmationListResponse:
      type: object
      required:
      - status_code
      - timestamp
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FinancialAdviceConfirmation'
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    TerminalActivation:
      type: object
      description: >-
        Terminal data used for an activation request. terminal_id is optional because
        it can be assigned by the PTP during activation.
      required:
      - last_updated
      properties:
        terminal_id:
          type: string
          maxLength: 36
          description: Unique ID that identifies the terminal, when already known.
        customer_reference:
          type: string
          maxLength: 36
          description: Reference used to link the terminal to a CSMS.
        party_id:
          type: string
          minLength: 3
          maxLength: 3
          description: Alternative to customer_reference.
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: Alternative to customer_reference.
        address:
          type: string
          maxLength: 45
        city:
          type: string
          maxLength: 45
        postal_code:
          type: string
          maxLength: 10
        state:
          type: string
          maxLength: 20
        country:
          type: string
          minLength: 3
          maxLength: 3
        coordinates:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/GeoLocation
        invoice_base_url:
          type: string
          format: uri
          maxLength: 255
        invoice_creator:
          $ref: '#/components/schemas/InvoiceCreator'
        reference:
          type: string
          maxLength: 36
        location_ids:
          type: array
          items:
            type: string
            maxLength: 36
        evse_uids:
          type: array
          items:
            type: string
            maxLength: 36
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    TerminalPatch:
      type: object
      description: Partial Terminal update used to assign location_ids and/or evse_uids.
      properties:
        location_ids:
          type: array
          items:
            type: string
            maxLength: 36
        evse_uids:
          type: array
          items:
            type: string
            maxLength: 36
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      anyOf:
      - required:
        - location_ids
      - required:
        - evse_uids
      additionalProperties: true
    Terminal:
      type: object
      description: A payment terminal device.
      required:
      - terminal_id
      - last_updated
      properties:
        terminal_id:
          type: string
          maxLength: 36
          description: Unique ID that identifies the terminal.
        customer_reference:
          type: string
          maxLength: 36
          description: Reference to link terminal to CSMS, provided via order process.
        party_id:
          type: string
          minLength: 3
          maxLength: 3
          description: Alternative to customer_reference.
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: Alternative to customer_reference.
        address:
          type: string
          maxLength: 45
          description: Street/block name and house number.
        city:
          type: string
          maxLength: 45
          description: City or town.
        postal_code:
          type: string
          maxLength: 10
          description: Postal code.
        state:
          type: string
          maxLength: 20
          description: State or province.
        country:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 3166-1 alpha-3 country code.
        coordinates:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/GeoLocation
        invoice_base_url:
          type: string
          format: uri
          maxLength: 255
          description: BaseURL to the downloadable invoice.
        invoice_creator:
          $ref: '#/components/schemas/InvoiceCreator'
        reference:
          type: string
          maxLength: 36
          description: Mapping value issued by PTP (e.g. serial number).
        location_ids:
          type: array
          items:
            type: string
            maxLength: 36
          description: List of all locations assigned to this terminal.
        evse_uids:
          type: array
          items:
            type: string
            maxLength: 36
          description: List of all EVSEs assigned to this terminal.
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    FinancialAdviceConfirmation:
      type: object
      description: Confirmation of a financial advice (payment capture).
      required:
      - id
      - authorization_reference
      - total_costs
      - currency
      - eft_data
      - capture_status_code
      - last_updated
      properties:
        id:
          type: string
          maxLength: 36
          description: Unique ID of this financial advice confirmation.
        authorization_reference:
          type: string
          maxLength: 36
          description: Reference to authorization given by PTP in Commands.StartSession.
        total_costs:
          $ref: ./shared/schemas/types.yaml#/components/schemas/Price
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217 currency code.
        eft_data:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 255
          description: Invoice relevant data from direct payment.
        capture_status_code:
          $ref: '#/components/schemas/CaptureStatusCode'
        capture_status_message:
          type: string
          maxLength: 255
          description: Message about any error at financial advice.
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    InvoiceCreator:
      type: string
      enum:
      - CPO
      - PTP
      description: Which party creates the invoice for the EV driver.
      x-enumDescriptions:
        CPO: The CPO issues the invoice and provides it via the invoice_base_url + authorization_reference.
        PTP: The PTP issues the invoice and directly shows/provides it the eDriver via the payment terminal.


    CaptureStatusCode:
      type: string
      enum:
      - SUCCESS
      - PARTIAL_SUCCESS
      - FAILED
      description: Status code for the financial advice (payment capture).
      x-enumDescriptions:
        SUCCESS: Indicates that the payment capture was completed successfully without any issues. Funds were secured and will be settled according to the payment processor's timeline. This status confirms that all checks (e.g., fraud, card validation) passed and the transaction was approved.
        PARTIAL_SUCCESS: Used when only part of the transaction amount was approved or when certain conditions of the payment were altered during processing. This might occur in scenarios where the available balance was insufficient for the full requested amount, or specific transaction limits were enforced by the card issuer.
        FAILED: Indicates that the payment capture attempt was unsuccessful. This failure can be due to various reasons such as insufficient funds, card expiration, network issues, or refusal by the card issuer.
