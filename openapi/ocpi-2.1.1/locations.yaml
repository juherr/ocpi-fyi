openapi: 3.1.0
info:
  title: OCPI 2.1.1 - Locations
  description: The Locations module provides information about charging locations,
    EVSEs, and connectors. Data owner is typically the CPO.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi/2.1.1
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /locations:
    get:
      operationId: getLocations
      summary: Get Locations List (CPO Interface)
      description: Fetch Location objects from the CPO, last updated between date_from
        and date_to (paginated).
      tags:
        - Locations - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/date_from
        - $ref: ./shared/parameters.yaml#/components/parameters/date_to
        - $ref: ./shared/parameters.yaml#/components/parameters/offset
        - $ref: ./shared/parameters.yaml#/components/parameters/limit
      responses:
        "200":
          description: List of Location objects.
          headers:
            X-Total-Count:
              $ref: ./shared/headers.yaml#/components/headers/X-Total-Count
            X-Limit:
              $ref: ./shared/headers.yaml#/components/headers/X-Limit
            Link:
              $ref: ./shared/headers.yaml#/components/headers/Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"
        "401":
          description: Unauthorized.
  /locations/{location_id}:
    get:
      operationId: getLocation
      summary: Get Location Object (CPO Interface)
      description: Retrieve a specific Location object by its ID.
      tags:
        - Locations - CPO Interface
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      responses:
        "200":
          description: The requested Location object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Location not found.
  /locations/{location_id}/{evse_uid}:
    get:
      operationId: getEvse
      summary: Get EVSE Object (CPO Interface)
      description: Retrieve a specific EVSE object from a Location.
      tags:
        - Locations - CPO Interface
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      responses:
        "200":
          description: The requested EVSE object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvseResponse"
        "401":
          description: Unauthorized.
        "404":
          description: EVSE not found.
  /locations/{location_id}/{evse_uid}/{connector_id}:
    get:
      operationId: getConnector
      summary: Get Connector Object (CPO Interface)
      description: Retrieve a specific Connector object from an EVSE.
      tags:
        - Locations - CPO Interface
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: The requested Connector object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Connector not found.
  /locations/{country_code}/{party_id}/{location_id}:
    get:
      operationId: getReceiverLocation
      summary: Get Location (eMSP Interface)
      description: Retrieve a Location object as stored in the eMSP's system.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      responses:
        "200":
          description: The requested Location object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Location not found.
    put:
      operationId: putReceiverLocation
      summary: Push Location (eMSP Interface)
      description: Push a new or updated Location object to the eMSP.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Location"
            example:
              id: LOC1
              type: ON_STREET
              name: Gent Zuid
              address: F.Rooseveltlaan 3A
              city: Gent
              postal_code: "9000"
              country: BEL
              coordinates:
                latitude: "51.047599"
                longitude: "3.729944"
              time_zone: Europe/Brussels
              last_updated: 2019-07-01T12:12:11Z
      responses:
        "200":
          description: Location updated successfully.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "201":
          description: Location created successfully.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
    patch:
      operationId: patchReceiverLocation
      summary: Partially Update Location (eMSP Interface)
      description: Push partial updates to a Location object. Only fields/objects that
        need to be updated have to be present; fields/objects not specified are
        considered unchanged.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPatch"
            example:
              name: Interparking Gent Zuid
              last_updated: 2019-06-24T12:39:09Z
      responses:
        "200":
          description: Location partially updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
  /locations/{country_code}/{party_id}/{location_id}/{evse_uid}:
    get:
      operationId: getReceiverEvse
      summary: Get EVSE (eMSP Interface)
      description: Retrieve an EVSE object as stored in the eMSP's system.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      responses:
        "200":
          description: The requested EVSE object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvseResponse"
        "401":
          description: Unauthorized.
        "404":
          description: EVSE not found.
    put:
      operationId: putReceiverEvse
      summary: Push EVSE (eMSP Interface)
      description: Push a new or updated EVSE to the eMSP. The Receiver SHALL
        update the last_updated field on the parent Location.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EVSE"
            example:
              uid: fd855359-bc81-47bb-bb89-849ae3dac89e
              evse_id: NL*ALF*E000000001
              status: AVAILABLE
              connectors:
                - id: "1"
                  standard: IEC_62196_T2
                  format: SOCKET
                  power_type: AC_3_PHASE
                  voltage: 220
                  amperage: 16
                  last_updated: 2019-07-01T12:12:11Z
              last_updated: 2019-07-01T12:12:11Z
      responses:
        "200":
          description: EVSE updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "201":
          description: EVSE created.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
    patch:
      operationId: patchReceiverEvse
      summary: Partially Update EVSE (eMSP Interface)
      description: Push partial updates to an EVSE. Only fields/objects that need to
        be updated have to be present; fields/objects not specified are
        considered unchanged.
        The Receiver SHALL update last_updated on the parent Location.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvsePatch"
            example:
              status: CHARGING
              last_updated: 2019-06-24T12:39:09Z
      responses:
        "200":
          description: EVSE partially updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
  /locations/{country_code}/{party_id}/{location_id}/{evse_uid}/{connector_id}:
    get:
      operationId: getReceiverConnector
      summary: Get Connector (eMSP Interface)
      description: Retrieve a Connector object as stored in the eMSP's system.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: The requested Connector object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Connector not found.
    put:
      operationId: putReceiverConnector
      summary: Push Connector (eMSP Interface)
      description: Push a new or updated Connector to the eMSP. The Receiver SHALL
        update last_updated on the parent EVSE and Location.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Connector"
            example:
              id: "1"
              standard: IEC_62196_T2
              format: SOCKET
              power_type: AC_3_PHASE
              voltage: 220
              amperage: 16
              last_updated: 2019-07-01T12:12:11Z
      responses:
        "200":
          description: Connector updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "201":
          description: Connector created.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
    patch:
      operationId: patchReceiverConnector
      summary: Partially Update Connector (eMSP Interface)
      description: Push partial updates to a Connector. Only fields/objects that need
        to be updated have to be present; fields/objects not specified are
        considered unchanged.
        The Receiver SHALL update last_updated on the parent EVSE and Location.
      tags:
        - Locations - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: evse_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 39
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorPatch"
            example:
              tariff_id: "15"
              last_updated: 2019-06-24T12:39:09Z
      responses:
        "200":
          description: Connector partially updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    LocationResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/Location"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    LocationListResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    EvseResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/EVSE"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    ConnectorResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/Connector"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    LocationPatch:
      type: object
      description: Partial Location object for PATCH. Only the fields that have to
        be updated need to be present; fields that are not specified are
        considered unchanged.
      properties:
        id:
          type: string
          maxLength: 39
        type:
          $ref: "#/components/schemas/LocationType"
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 45
        city:
          type: string
          maxLength: 45
        postal_code:
          type: string
          maxLength: 10
        country:
          type: string
          maxLength: 3
        coordinates:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/GeoLocation
        related_locations:
          type: array
          items:
            $ref: ./shared/schemas/locations.yaml#/components/schemas/AdditionalGeoLocation
        evses:
          type: array
          items:
            $ref: "#/components/schemas/EVSE"
        directions:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
        operator:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/BusinessDetails
        suboperator:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/BusinessDetails
        owner:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/BusinessDetails
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/Facility"
        time_zone:
          type: string
          maxLength: 255
        opening_times:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/Hours
        charging_when_closed:
          type: boolean
        images:
          type: array
          items:
            $ref: ./shared/schemas/locations.yaml#/components/schemas/Image
        energy_mix:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/EnergyMix
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    EvsePatch:
      type: object
      description: Partial EVSE object for PATCH. Only the fields that have to be
        updated need to be present; fields that are not specified are considered
        unchanged.
      properties:
        uid:
          type: string
          maxLength: 39
        evse_id:
          type: string
          maxLength: 48
        status:
          $ref: "#/components/schemas/Status"
        status_schedule:
          type: array
          items:
            $ref: "#/components/schemas/StatusSchedule"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        floor_level:
          type: string
          maxLength: 4
        coordinates:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/GeoLocation
        physical_reference:
          type: string
          maxLength: 16
        directions:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
        parking_restrictions:
          type: array
          items:
            $ref: "#/components/schemas/ParkingRestriction"
        images:
          type: array
          items:
            $ref: ./shared/schemas/locations.yaml#/components/schemas/Image
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    ConnectorPatch:
      type: object
      description: Partial Connector object for PATCH. Only the fields that have to
        be updated need to be present; fields that are not specified are
        considered unchanged.
      properties:
        id:
          type: string
          maxLength: 36
        standard:
          $ref: "#/components/schemas/ConnectorType"
        format:
          $ref: "#/components/schemas/ConnectorFormat"
        power_type:
          $ref: "#/components/schemas/PowerType"
        voltage:
          type: integer
        amperage:
          type: integer
        tariff_id:
          type: string
          maxLength: 36
        terms_and_conditions:
          type: string
          format: uri
          maxLength: 255
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    Location:
      type: object
      description: The Location object describes the location and its properties where
        a group of EVSEs that belong together are installed.
      required:
        - id
        - type
        - address
        - city
        - postal_code
        - country
        - coordinates
        - last_updated
      properties:
        id:
          type: string
          maxLength: 39
          description: Uniquely identifies the location within the CPO's platform (and
            suboperator platforms). This field can never be changed, modified or
            renamed.
        type:
          $ref: "#/components/schemas/LocationType"
        name:
          type: string
          maxLength: 255
          description: Display name of the location.
        address:
          type: string
          maxLength: 45
          description: Street/block name and house number if available.
        city:
          type: string
          maxLength: 45
          description: City or town.
        postal_code:
          type: string
          maxLength: 10
          description: Postal code of the location.
        country:
          type: string
          maxLength: 3
          description: ISO 3166-1 alpha-3 code for the country of this location.
        coordinates:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/GeoLocation
        related_locations:
          type: array
          items:
            $ref: ./shared/schemas/locations.yaml#/components/schemas/AdditionalGeoLocation
          description: Geographical locations of related points relevant to the user.
        evses:
          type: array
          items:
            $ref: "#/components/schemas/EVSE"
          description: List of EVSEs that belong to this Location.
        directions:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
          description: Human-readable directions on how to reach the location.
        operator:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/BusinessDetails
        suboperator:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/BusinessDetails
        owner:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/BusinessDetails
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/Facility"
          description: Optional list of facilities this charge location directly belongs
            to.
        time_zone:
          type: string
          maxLength: 255
          description: One of IANA tzdata's TZ-values representing the time zone of the
            location. Examples "Europe/Oslo", "Europe/Zurich".
        opening_times:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/Hours
        charging_when_closed:
          type: boolean
          description: >-
            Indicates if the EVSEs are still charging outside the opening hours
            of the location. E.g. when the parking garage closes its barriers
            over night, is it allowed to charge till the next morning?
            Default: true
        images:
          type: array
          items:
            $ref: ./shared/schemas/locations.yaml#/components/schemas/Image
          description: Links to images related to the location such as photos or logos.
        energy_mix:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/EnergyMix
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    EVSE:
      type: object
      description: >-
        The EVSE object describes the part that controls the power supply to a
        single EV in a single session. It always belongs to a Location object.
        It will only contain directions to get from the location to the EVSE
        (i.e. floor, physical_reference or directions). When these properties
        are insufficient to reach the EVSE from the Location point, then it
        typically indicates that this EVSE should be put in a different Location
        object (sometimes with the same address but with different
        coordinates/directions). An EVSE object has a list of connectors which
        can not be used simultaneously: only one connector per EVSE can be used
        at the time.
      required:
        - uid
        - status
        - connectors
        - last_updated
      properties:
        uid:
          type: string
          maxLength: 39
          description: >-
            Uniquely identifies the EVSE within the CPOs platform (and
            suboperator platforms). For example a database unique ID or the
            "EVSE ID". This field can never be changed, modified or renamed.
            This is the 'technical' identification of the EVSE, not to be used
            as 'human readable' identification, use the field: evse_id for that.
        evse_id:
          type: string
          maxLength: 48
          description: Compliant with the eMI3 standard EVSE ID.
        status:
          $ref: "#/components/schemas/Status"
        status_schedule:
          type: array
          items:
            $ref: "#/components/schemas/StatusSchedule"
          description: Indicates a planned status in the future of the EVSE.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
          description: List of functionalities that the EVSE is capable of.
        connectors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Connector"
          description: List of available connectors on the EVSE.
        floor_level:
          type: string
          maxLength: 4
          description: Level on which the charging station is located (in garage
            buildings) in the locally displayed numbering scheme.
        coordinates:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/GeoLocation
        physical_reference:
          type: string
          maxLength: 16
          description: A number/string printed on the outside of the EVSE for visual
            identification.
        directions:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
          description: Multi-language human-readable directions when more detailed
            information on how to reach the EVSE from the Location is required.
        parking_restrictions:
          type: array
          items:
            $ref: "#/components/schemas/ParkingRestriction"
          description: The restrictions that apply to the parking spot.
        images:
          type: array
          items:
            $ref: ./shared/schemas/locations.yaml#/components/schemas/Image
          description: Links to images related to the EVSE such as photos or logos.
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    Connector:
      type: object
      description: >-
        A connector is the socket or cable available for the EV to use. A single
        EVSE may provide multiple connectors but only one of them can be in use
        at the same time. A connector always belongs to an EVSE object.
      required:
        - id
        - standard
        - format
        - power_type
        - voltage
        - amperage
        - last_updated
      properties:
        id:
          type: string
          maxLength: 36
          description: Identifier of the connector within the EVSE. Two connectors may
            have the same id as long as they do not belong to the same EVSE object.
        standard:
          $ref: "#/components/schemas/ConnectorType"
        format:
          $ref: "#/components/schemas/ConnectorFormat"
        power_type:
          $ref: "#/components/schemas/PowerType"
        voltage:
          type: integer
          description: Voltage of the connector (line to neutral for AC_3_PHASE), in
            volt [V].
        amperage:
          type: integer
          description: Maximum amperage of the connector, in ampere [A].
        tariff_id:
          type: string
          maxLength: 36
          description: Identifier of the current charging tariff structure. For a "Free
            of Charge" tariff this field should be set, and point to a defined
            "Free of Charge" tariff.
        terms_and_conditions:
          type: string
          format: uri
          maxLength: 255
          description: URL to the operator's terms and conditions.
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    StatusSchedule:
      type: object
      description: A planned status update for an EVSE.
      required:
        - period_begin
        - status
      properties:
        period_begin:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        period_end:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        status:
          $ref: "#/components/schemas/Status"
      additionalProperties: true
    Status:
      type: string
      enum:
        - AVAILABLE
        - BLOCKED
        - CHARGING
        - INOPERATIVE
        - OUTOFORDER
        - PLANNED
        - REMOVED
        - RESERVED
        - UNKNOWN
      x-enumDescriptions:
        AVAILABLE: The EVSE/Connector is able to start a new charging session.
        BLOCKED: The EVSE/Connector is not accessible because of a physical barrier, i.e. a car.
        CHARGING: The EVSE/Connector is in use.
        INOPERATIVE: The EVSE/Connector is not yet active or it is no longer available (deleted).
        OUTOFORDER: The EVSE/Connector is currently out of order.
        PLANNED: The EVSE/Connector is planned, will be operating soon
        REMOVED: The EVSE/Connector/charge point is discontinued/removed.
        RESERVED: The EVSE/Connector is reserved for a particular EV driver and is unavailable for other drivers.
        UNKNOWN: No status information available. (Also used when offline)
      description: The status of an EVSE.
    Capability:
      type: string
      enum:
        - CHARGING_PROFILE_CAPABLE
        - CREDIT_CARD_PAYABLE
        - REMOTE_START_STOP_CAPABLE
        - RESERVABLE
        - RFID_READER
        - UNLOCK_CAPABLE
      x-enumDescriptions:
        CHARGING_PROFILE_CAPABLE: The EVSE supports charging profiles. Sending Charging Profiles is not yet supported by OCPI.
        CREDIT_CARD_PAYABLE: Charging at this EVSE can be payed with credit card.
        REMOTE_START_STOP_CAPABLE: The EVSE can remotely be started/stopped.
        RESERVABLE: The EVSE can be reserved.
        RFID_READER: Charging at this EVSE can be authorized with a RFID token
        UNLOCK_CAPABLE: Connectors have mechanical lock that can be requested by the eMSP to be unlocked.
      description: The capabilities of an EVSE.
    ConnectorFormat:
      type: string
      enum:
        - SOCKET
        - CABLE
      x-enumDescriptions:
        SOCKET: The connector is a socket; the EV user needs to bring a fitting plug.
        CABLE: The connector is an attached cable; the EV users car needs to have a fitting inlet.
      description: The format of a connector (socket or attached cable).
