openapi: 3.1.0
info:
  title: OCPI 2.1.1 - CDRs
  description: The CDRs module provides Charge Detail Records (CDRs) which
    describe completed charging sessions. Data owner is typically the CPO.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi/2.1.1
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /cdrs:
    get:
      operationId: getCdrs
      summary: Get CDRs List (CPO Interface)
      description: Fetch CDR objects from the CPO, last updated between date_from and
        date_to (paginated).
      tags:
        - CDRs - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/date_from
        - $ref: ./shared/parameters.yaml#/components/parameters/date_to
        - $ref: ./shared/parameters.yaml#/components/parameters/offset
        - $ref: ./shared/parameters.yaml#/components/parameters/limit
      responses:
        "200":
          description: List of CDR objects.
          headers:
            X-Total-Count:
              $ref: ./shared/headers.yaml#/components/headers/X-Total-Count
            X-Limit:
              $ref: ./shared/headers.yaml#/components/headers/X-Limit
            Link:
              $ref: ./shared/headers.yaml#/components/headers/Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CDRListResponse"
        "401":
          description: Unauthorized.
    post:
      operationId: postReceiverCdr
      summary: Create CDR (eMSP Interface)
      description: Create a new CDR in the eMSP's system. The response SHALL contain a
        Location header with the URL to the newly created CDR.
      tags:
        - CDRs - eMSP Interface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CDR"
      responses:
        "201":
          description: CDR created. Location header contains URL to the new CDR.
          headers:
            Location:
              description: URL to the newly created CDR object.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
  /cdrs/{cdr_id}:
    get:
      operationId: getReceiverCdr
      summary: Get CDR (eMSP Interface)
      description: Retrieve an existing CDR from the eMSP's system. The URL is
        provided by the eMSP in the Location header of the POST response.
      tags:
        - CDRs - eMSP Interface
      parameters:
        - name: cdr_id
          in: path
          required: true
          description: ID of the CDR (as returned in the Location header).
          schema:
            type: string
      responses:
        "200":
          description: The requested CDR object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CDRResponse"
        "401":
          description: Unauthorized.
        "404":
          description: CDR not found.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    CDRResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/CDR"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    CDRListResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CDR"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    CDR:
      type: object
      description: The CDR object describes the Charging Session and its costs, how
        these costs are built up, etc. A Charge Detail Record is the description of a
        concluded charging session. Once sent to the eMSP, a CDR cannot be changed or
        replaced.
      required:
        - id
        - start_date_time
        - stop_date_time
        - auth_id
        - auth_method
        - location
        - currency
        - charging_periods
        - total_cost
        - total_energy
        - total_time
        - last_updated
      properties:
        id:
          type: string
          maxLength: 36
          description: Uniquely identifies the CDR within the CPOs platform (and
            suboperator platforms).
        start_date_time:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        stop_date_time:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        auth_id:
          type: string
          maxLength: 36
          description: Reference to a token, identified by the auth_id field of the
            Token.
        auth_method:
          $ref: ./shared/schemas/cdrs.yaml#/components/schemas/AuthMethod
        location:
          $ref: ./locations.yaml#/components/schemas/Location
        meter_id:
          type: string
          maxLength: 255
          description: Identification of the Meter inside the Charge Point.
        currency:
          type: string
          maxLength: 3
          description: Currency of the CDR in ISO 4217 Code.
        tariffs:
          type: array
          items:
            $ref: ./tariffs.yaml#/components/schemas/Tariff
          description: List of relevant tariff elements. When relevant, a "Free of
            Charge" tariff should also be in this list, and point to a defined "Free of
            Charge" tariff.
        charging_periods:
          type: array
          minItems: 1
          items:
            $ref: ./shared/schemas/cdrs.yaml#/components/schemas/ChargingPeriod
          description: List of charging periods that make up this charging session. A
            session consists of 1 or more periods, where each period has a different
            relevant Tariff.
        total_cost:
          type: number
          description: Total cost (excluding VAT) of this transaction.
        total_energy:
          type: number
          description: Total energy charged, in kWh.
        total_time:
          type: number
          description: Total duration of this session (including the duration of
            charging and not charging), in hours.
        total_parking_time:
          type: number
          description: Total duration during this session that the EV is not being
            charged (no energy being transferred between EVSE and EV), in hours.
        remark:
          type: string
          maxLength: 255
          description: Optional remark, can be used to provide additional human readable
            information to the CDR, for example the reason why a transaction was stopped.
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
      example:
        id: "12345"
        start_date_time: "2015-06-29T21:39:09Z"
        stop_date_time: "2015-06-29T23:37:32Z"
        auth_id: DE8ACC12E46L89
        auth_method: WHITELIST
        location:
          id: LOC1
          type: ON_STREET
          name: Gent Zuid
          address: F.Rooseveltlaan 3A
          city: Gent
          postal_code: "9000"
          country: BE
          coordinates:
            latitude: "3.729944"
            longitude: "51.047599"
          evses:
            - uid: "3256"
              evse_id: BE-BEC-E041503003
              status: AVAILABLE
              connectors:
                - id: "1"
                  standard: IEC_62196_T2
                  format: SOCKET
                  power_type: AC_1_PHASE
                  voltage: 230
                  amperage: 64
                  tariff_id: "11"
                  last_updated: "2015-06-29T21:39:01Z"
              last_updated: "2015-06-29T21:39:01Z"
          last_updated: "2015-06-29T21:39:01Z"
        currency: EUR
        tariffs:
          - id: "12"
            currency: EUR
            elements:
              - price_components:
                  - type: TIME
                    price: 2.00
                    step_size: 300
            last_updated: "2015-02-02T14:15:01Z"
        charging_periods:
          - start_date_time: "2015-06-29T21:39:09Z"
            dimensions:
              - type: TIME
                volume: 1.973
        total_cost: 4.00
        total_energy: 15.342
        total_time: 1.973
        last_updated: "2015-06-29T22:01:13Z"
