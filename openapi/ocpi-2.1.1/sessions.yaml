openapi: 3.1.0
info:
  title: OCPI 2.1.1 - Sessions
  description: The Sessions module provides information about ongoing and
    completed charging sessions. Data owner is typically the CPO.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi/2.1.1
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /sessions:
    get:
      operationId: getSessions
      summary: Get Sessions List (CPO Interface)
      description: Fetch Session objects from the CPO, last updated between date_from
        and date_to (paginated).
      tags:
        - Sessions - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/date_from
        - $ref: ./shared/parameters.yaml#/components/parameters/date_to
        - $ref: ./shared/parameters.yaml#/components/parameters/offset
        - $ref: ./shared/parameters.yaml#/components/parameters/limit
      responses:
        "200":
          description: List of Session objects.
          headers:
            X-Total-Count:
              $ref: ./shared/headers.yaml#/components/headers/X-Total-Count
            X-Limit:
              $ref: ./shared/headers.yaml#/components/headers/X-Limit
            Link:
              $ref: ./shared/headers.yaml#/components/headers/Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Unauthorized.
  /sessions/{country_code}/{party_id}/{session_id}:
    get:
      operationId: getReceiverSession
      summary: Get Session (eMSP Interface)
      description: Retrieve a Session object as stored in the eMSP's system.
      tags:
        - Sessions - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: The requested Session object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Session not found.
    put:
      operationId: putReceiverSession
      summary: Push Session (eMSP Interface)
      description: Push a new or updated Session object to the eMSP. A new Session
        replaces any existing Session. charging_periods from new Session replace
        old ones.
      tags:
        - Sessions - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Session"
            example:
              id: "101"
              start_datetime: 2015-06-29T22:39:09Z
              end_datetime: 2015-06-29T23:50:16Z
              kwh: 41.12
              auth_id: DE8ACC12E46L89
              auth_method: WHITELIST
              location:
                id: LOC1
                type: ON_STREET
                name: Gent Zuid
                address: F.Rooseveltlaan 3A
                city: Gent
                postal_code: "9000"
                country: BEL
                coordinates:
                  latitude: "3.729944"
                  longitude: "51.047599"
                evses:
                  - uid: "3256"
                    evse_id: BE-BEC-E041503003
                    status: AVAILABLE
                    connectors:
                      - id: "1"
                        standard: IEC_62196_T2
                        format: SOCKET
                        power_type: AC_1_PHASE
                        voltage: 230
                        amperage: 64
                        tariff_id: "11"
                        last_updated: 2015-06-29T22:39:09Z
                    last_updated: 2015-06-29T22:39:09Z
                last_updated: 2015-06-29T22:39:09Z
              currency: EUR
              total_cost: 2.50
              status: COMPLETED
              last_updated: 2015-06-29T23:50:17Z
      responses:
        "200":
          description: Session updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
    patch:
      operationId: patchReceiverSession
      summary: Partially Update Session (eMSP Interface)
      description: "Push partial updates to a Session. Only fields/objects that need
        to be updated have to be present; fields/objects not specified are
        considered unchanged. For charging_periods: acts as a request to add
        ChargingPeriod objects. To replace or remove charging_periods, use PUT
        instead."
      tags:
        - Sessions - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPatch"
            example:
              total_cost: 0.60
              last_updated: 2019-06-23T08:11:00Z
      responses:
        "200":
          description: Session partially updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    SessionResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/Session"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    SessionListResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    SessionPatch:
      type: object
      description: Partial Session object for PATCH. Only the fields that have to be
        updated need to be present; fields that are not specified are considered
        unchanged.
      properties:
        end_datetime:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        kwh:
          type: number
        auth_id:
          type: string
          maxLength: 36
        auth_method:
          $ref: ./shared/schemas/cdrs.yaml#/components/schemas/AuthMethod
        location:
          $ref: ./locations.yaml#/components/schemas/Location
        meter_id:
          type: string
          maxLength: 255
        currency:
          type: string
          maxLength: 3
        charging_periods:
          type: array
          items:
            $ref: ./shared/schemas/cdrs.yaml#/components/schemas/ChargingPeriod
        total_cost:
          type: number
        status:
          $ref: "#/components/schemas/SessionStatus"
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    Session:
      type: object
      description: Describes one charging session.
      required:
        - id
        - start_datetime
        - kwh
        - auth_id
        - auth_method
        - location
        - currency
        - status
        - last_updated
      properties:
        id:
          type: string
          maxLength: 36
          description: The unique id that identifies the session in the CPO platform.
        start_datetime:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        end_datetime:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        kwh:
          type: number
          description: >-
            How many kWh are charged. Numbers in OCPI are formatted as JSON
            numbers; unless mentioned otherwise, numbers use 4 decimals and a
            sufficiently large amount of digits.
        auth_id:
          type: string
          maxLength: 36
          description: Reference to a token, identified by the auth_id field of the Token.
        auth_method:
          $ref: ./shared/schemas/cdrs.yaml#/components/schemas/AuthMethod
        location:
          $ref: ./locations.yaml#/components/schemas/Location
        meter_id:
          type: string
          maxLength: 255
          description: Optional identification of the kWh meter.
        currency:
          type: string
          maxLength: 3
          description: ISO 4217 code of the currency used for this session.
        charging_periods:
          type: array
          items:
            $ref: ./shared/schemas/cdrs.yaml#/components/schemas/ChargingPeriod
          description: An optional list of charging periods that can be used to
            calculate and verify the total cost.
        total_cost:
          type: number
          description: >-
            The total cost (excluding VAT) of the session in the specified
            currency. This is the price that the eMSP will have to pay to the
            CPO. A total_cost of 0.00 means free of charge. When omitted, no
            price information is given in the Session object, this does not have
            to mean it is free of charge.
        status:
          $ref: "#/components/schemas/SessionStatus"
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    SessionStatus:
      type: string
      enum:
        - ACTIVE
        - COMPLETED
        - INVALID
        - PENDING
      x-enumDescriptions:
        ACTIVE: "The session is accepted and active. Al pre-condition are met: Communication between EV and EVSE (for example: cable plugged in correctly), EV or Driver is authorized. EV is being charged, or can be charged. Energy is, or is not, being transfered."
        COMPLETED: The session is finished successfully. No more modifications will be made to this session.
        INVALID: The session is declared invalid and will not be billed.
        PENDING: The session is pending, it has not yet started. Not all pre-condition are met. This is the initial state. This session might never become an active session.
      description: The status of a charging session.
