openapi: 3.1.0
info:
  title: OCPI 2.1.1 - Tokens
  description: The Tokens module provides information about tokens used for
    charging authorization. Includes real-time authorization. Data owner is
    typically the eMSP.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi/2.1.1
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /tokens:
    get:
      operationId: getTokens
      summary: Get Tokens List (eMSP Interface)
      description: Fetch Token objects from the eMSP, last updated between date_from
        and date_to (paginated).
      tags:
        - Tokens - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/date_from
        - $ref: ./shared/parameters.yaml#/components/parameters/date_to
        - $ref: ./shared/parameters.yaml#/components/parameters/offset
        - $ref: ./shared/parameters.yaml#/components/parameters/limit
      responses:
        "200":
          description: List of Token objects.
          headers:
            X-Total-Count:
              $ref: ./shared/headers.yaml#/components/headers/X-Total-Count
            X-Limit:
              $ref: ./shared/headers.yaml#/components/headers/X-Limit
            Link:
              $ref: ./shared/headers.yaml#/components/headers/Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"
        "401":
          description: Unauthorized.
  /tokens/{token_uid}/authorize:
    post:
      operationId: postTokenAuthorize
      summary: Real-time Authorization (eMSP Interface)
      description: Perform a real-time authorization request to the eMSP, validating
        if a Token may be used at the optionally given Location.
      tags:
        - Tokens - eMSP Interface
      parameters:
        - name: token_uid
          in: path
          required: true
          description: Token.uid of the Token to authorize.
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token to authorize. Default if omitted is RFID.
          schema:
            $ref: ./shared/schemas/tokens.yaml#/components/schemas/TokenType
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ./shared/schemas/tokens.yaml#/components/schemas/LocationReferences
      responses:
        "200":
          description: Authorization result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationInfoResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Token not known by the eMSP.
  /tokens/{country_code}/{party_id}/{token_uid}:
    get:
      operationId: getReceiverToken
      summary: Get Token (CPO Interface)
      description: Retrieve a Token object as stored in the CPO's system.
      tags:
        - Tokens - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: token_uid
          in: path
          required: true
          description: Token.uid of the Token to retrieve.
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token to retrieve. Default if omitted is RFID.
          schema:
            $ref: ./shared/schemas/tokens.yaml#/components/schemas/TokenType
      responses:
        "200":
          description: The requested Token object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Token not found.
    put:
      operationId: putReceiverToken
      summary: Push Token (CPO Interface)
      description: Push a new or updated Token object to the CPO. The URL parameters
        country_code and party_id identify the eMSP that owns the Token.
      tags:
        - Tokens - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: token_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token. Default if omitted is RFID.
          schema:
            $ref: ./shared/schemas/tokens.yaml#/components/schemas/TokenType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Token"
            example:
              uid: "012345678"
              type: RFID
              auth_id: DE8ACC12E46L89
              visual_number: DF000-2001-8999
              issuer: TheNewMotion
              valid: true
              whitelist: ALWAYS
              last_updated: 2015-06-29T22:39:09Z
      responses:
        "200":
          description: Token updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
    patch:
      operationId: patchReceiverToken
      summary: Partially Update Token (CPO Interface)
      description: Push partial updates to a Token. Only fields that need to be
        updated have to be present, fields not specified are considered
        unchanged. The request MUST contain last_updated. Tokens cannot be
        deleted; use PUT or PATCH to invalidate.
      tags:
        - Tokens - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: token_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token. Default if omitted is RFID.
          schema:
            $ref: ./shared/schemas/tokens.yaml#/components/schemas/TokenType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPatch"
            example:
              valid: false
              last_updated: 2018-12-10T17:25:10Z
      responses:
        "200":
          description: Token partially updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    TokenResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/Token"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    TokenListResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    AuthorizationInfoResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/AuthorizationInfo"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    TokenPatch:
      type: object
      description: Partial Token object for PATCH. MUST contain last_updated.
      required:
        - last_updated
      properties:
        uid:
          type: string
          maxLength: 36
        type:
          $ref: ./shared/schemas/tokens.yaml#/components/schemas/TokenType
        auth_id:
          type: string
          maxLength: 36
        visual_number:
          type: string
          maxLength: 64
        issuer:
          type: string
          maxLength: 64
        valid:
          type: boolean
        whitelist:
          $ref: ./shared/schemas/tokens.yaml#/components/schemas/WhitelistType
        language:
          type: string
          minLength: 2
          maxLength: 2
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    Token:
      type: object
      description: Representation of a charging token.
      required:
        - uid
        - type
        - auth_id
        - issuer
        - valid
        - whitelist
        - last_updated
      properties:
        uid:
          type: string
          maxLength: 36
          description: Identification used by CPO system to identify this token.
            Currently, in most cases, this is the RFID hidden ID as read by the RFID
            reader.
        type:
          $ref: ./shared/schemas/tokens.yaml#/components/schemas/TokenType
        auth_id:
          type: string
          maxLength: 36
          description: >-
            Uniquely identifies the EV Driver contract token within the eMSP's
            platform (and suboperator platforms). Recommended to follow the
            specification for eMA ID from "eMI3 standard version V1.0"
            (http://emi3group.com/documents-links/) "Part 2: business objects."
        visual_number:
          type: string
          maxLength: 64
          description: Visual readable number/identification as printed on the Token
            (RFID card), might be equal to the auth_id.
        issuer:
          type: string
          maxLength: 64
          description: Issuing company, most of the times the name of the company printed
            on the token (RFID card), not necessarily the eMSP.
        valid:
          type: boolean
          description: Is this Token valid.
        whitelist:
          $ref: ./shared/schemas/tokens.yaml#/components/schemas/WhitelistType
        language:
          type: string
          maxLength: 2
          description: >-
            Language Code ISO 639-1. This optional field indicates the Token
            owner's preferred interface language. If the language is not provided
            or not supported then the CPO is free to choose its own language.
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    AuthorizationInfo:
      type: object
      description: Information about the authorization status of a Token.
      required:
        - allowed
      properties:
        allowed:
          $ref: ./shared/schemas/tokens.yaml#/components/schemas/AllowedType
        location:
          $ref: ./shared/schemas/tokens.yaml#/components/schemas/LocationReferences
        info:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
      additionalProperties: true
