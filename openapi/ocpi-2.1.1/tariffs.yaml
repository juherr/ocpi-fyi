openapi: 3.1.0
info:
  title: OCPI 2.1.1 - Tariffs
  description: The Tariffs module provides information about the tariffs used by a
    CPO. Data owner is typically the CPO.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi/2.1.1
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /tariffs:
    get:
      operationId: getTariffs
      summary: Get Tariffs List (CPO Interface)
      description: Fetch Tariff objects from the CPO, last updated between date_from
        and date_to (paginated).
      tags:
        - Tariffs - CPO Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/date_from
        - $ref: ./shared/parameters.yaml#/components/parameters/date_to
        - $ref: ./shared/parameters.yaml#/components/parameters/offset
        - $ref: ./shared/parameters.yaml#/components/parameters/limit
      responses:
        "200":
          description: List of Tariff objects.
          headers:
            X-Total-Count:
              $ref: ./shared/headers.yaml#/components/headers/X-Total-Count
            X-Limit:
              $ref: ./shared/headers.yaml#/components/headers/X-Limit
            Link:
              $ref: ./shared/headers.yaml#/components/headers/Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffListResponse"
        "401":
          description: Unauthorized.
  /tariffs/{country_code}/{party_id}/{tariff_id}:
    get:
      operationId: getReceiverTariff
      summary: Get Tariff (eMSP Interface)
      description: Retrieve a Tariff object as stored in the eMSP's system for
        validation.
      tags:
        - Tariffs - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: tariff_id
          in: path
          required: true
          description: Tariff.id of the Tariff to retrieve.
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: The requested Tariff object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffResponse"
        "401":
          description: Unauthorized.
        "404":
          description: Tariff not found.
    put:
      operationId: putReceiverTariff
      summary: Push Tariff (eMSP Interface)
      description: Push a new or updated Tariff object to the eMSP.
      tags:
        - Tariffs - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: tariff_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tariff"
      responses:
        "200":
          description: Tariff updated.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "201":
          description: Tariff created.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
    delete:
      operationId: deleteReceiverTariff
      summary: Delete Tariff (eMSP Interface)
      description: Delete a Tariff object that is no longer in use.
      tags:
        - Tariffs - eMSP Interface
      parameters:
        - $ref: ./shared/parameters.yaml#/components/parameters/country_code
        - $ref: ./shared/parameters.yaml#/components/parameters/party_id
        - name: tariff_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
      responses:
        "200":
          description: Tariff deleted.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
        "401":
          description: Unauthorized.
        "404":
          description: Tariff not found.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    TariffResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/Tariff"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    TariffListResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tariff"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    Tariff:
      type: object
      description: >-
        A Tariff Object consists of a list of one or more TariffElements, these
        elements can be used to create complex Tariff structures. When the list
        of elements contains more than 1 element, then the first tariff in the
        list with matching restrictions will be used. It is advised to always
        set a "default" tariff, the last tariff in the list of elements with no
        restriction. This acts as a fallback when none of the TariffElements
        before this matches the current charging period.
      required:
        - id
        - currency
        - elements
        - last_updated
      properties:
        id:
          type: string
          maxLength: 36
          description: Uniquely identifies the Tariff within the CPO's platform (and
            suboperator platforms).
        currency:
          type: string
          maxLength: 3
          description: Currency of this Tariff, ISO 4217 code.
        tariff_alt_text:
          type: array
          items:
            $ref: ./shared/schemas/types.yaml#/components/schemas/DisplayText
          description: List of multi language alternative tariff info text.
        tariff_alt_url:
          type: string
          format: uri
          description: Alternative URL to tariff info.
        elements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TariffElement"
          description: List of Tariff Elements.
        energy_mix:
          $ref: ./shared/schemas/locations.yaml#/components/schemas/EnergyMix
        last_updated:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
      example:
        id: "12"
        currency: EUR
        elements:
          - price_components:
              - type: TIME
                price: 2.00
                step_size: 300
        last_updated: "2015-06-29T20:39:09Z"
    TariffElement:
      type: object
      description: A Tariff Element consists of Price Components and optional Restrictions.
      required:
        - price_components
      properties:
        price_components:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PriceComponent"
          description: List of Price Components that describe how a dimension is priced.
        restrictions:
          $ref: "#/components/schemas/TariffRestrictions"
      additionalProperties: true
    PriceComponent:
      type: object
      description: Describes how a specific dimension (energy, time, flat, parking) is
        priced.
      required:
        - type
        - price
        - step_size
      properties:
        type:
          $ref: "#/components/schemas/TariffDimensionType"
        price:
          type: number
          description: Price per unit (excluding VAT) for this Tariff dimension.
        step_size:
          type: integer
          description: Minimum amount to be billed. This unit will be billed in this
            step_size blocks. For example, if type is TIME and step_size is 300,
            then time will be billed in blocks of 5 minutes; so if 6 minutes are
            used, 10 minutes (2 blocks of step_size) will be billed.
      additionalProperties: true
    TariffRestrictions:
      type: object
      description: Restrictions that describe when a Tariff Element applies.
      properties:
        start_time:
          type: string
          maxLength: 5
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
          description: Start time of day, for example 13:30, valid from this time of the
            day. Must be in 24h format with leading zeros.
        end_time:
          type: string
          maxLength: 5
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
          description: End time of day, for example 19:45, valid until this time of the
            day. Same syntax as start_time.
        start_date:
          type: string
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Start date, for example 2015-12-24, valid from this day.
        end_date:
          type: string
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: End date, for example 2015-12-27, valid until this day (excluding
            this day).
        min_kwh:
          type: number
          description: Minimum used energy in kWh, for example 20, valid from this amount
            of energy is used.
        max_kwh:
          type: number
          description: Maximum used energy in kWh, for example 50, valid until this amount
            of energy is used.
        min_power:
          type: number
          description: Minimum power in kW, for example 0, valid from this charging speed.
        max_power:
          type: number
          description: Maximum power in kW, for example 20, valid up to this charging
            speed.
        min_duration:
          type: integer
          description: Minimum duration in seconds, valid for a duration from x seconds.
        max_duration:
          type: integer
          description: Maximum duration in seconds, valid for a duration up to x seconds.
        day_of_week:
          type: array
          items:
            $ref: "#/components/schemas/DayOfWeek"
          description: Which day(s) of the week this Tariff is valid.
      additionalProperties: true
    TariffDimensionType:
      type: string
      enum:
        - ENERGY
        - FLAT
        - PARKING_TIME
        - TIME
      description: "The dimension being priced: ENERGY (kWh), FLAT (no unit),
        PARKING_TIME (hours not charging), TIME (hours charging)."
    DayOfWeek:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      description: Day of the week.
