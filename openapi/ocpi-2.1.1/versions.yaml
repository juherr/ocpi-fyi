openapi: 3.1.0
info:
  title: OCPI 2.1.1 - Versions
  description: The required base module of OCPI. Via this module, clients can
    learn which versions of OCPI a server supports, and which modules it
    supports for each of the versions.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /versions:
    get:
      operationId: getVersions
      summary: Get Supported Versions
      description: Fetch all supported OCPI versions of this CPO or eMSP.
      tags:
        - Versions
      responses:
        "200":
          description: List of supported OCPI versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionListResponse"
        "401":
          description: Unauthorized - Missing or invalid credentials token.
  /versions/{version}:
    get:
      operationId: getVersionDetails
      summary: Get Version Details
      description: Fetch information about the supported endpoints and their URLs for
        a specific OCPI version.
      tags:
        - Versions
      parameters:
        - name: version
          in: path
          required: true
          description: The version number to get details for.
          schema:
            $ref: "#/components/schemas/VersionNumber"
      responses:
        "200":
          description: Version details with supported endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDetailsResponse"
        "401":
          description: Unauthorized - Missing or invalid credentials token.
        "404":
          description: Version not supported.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    VersionListResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    VersionDetailsResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/VersionDetails"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    Version:
      type: object
      description: OCPI version information.
      required:
        - version
        - url
      properties:
        version:
          $ref: "#/components/schemas/VersionNumber"
        url:
          type: string
          format: uri
          maxLength: 255
          description: URL to the endpoint containing version specific information.
      additionalProperties: true
    VersionDetails:
      type: object
      description: Detailed information about a specific OCPI version.
      required:
        - version
        - endpoints
      properties:
        version:
          $ref: "#/components/schemas/VersionNumber"
        endpoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Endpoint"
          description: A list of supported endpoints for this version.
      additionalProperties: true
    Endpoint:
      type: object
      description: Information about a supported OCPI endpoint.
      required:
        - identifier
        - url
      properties:
        identifier:
          $ref: "#/components/schemas/ModuleID"
        url:
          type: string
          format: uri
          maxLength: 255
          description: URL to the endpoint.
      additionalProperties: true
    ModuleID:
      anyOf:
        - type: string
          enum:
            - cdrs
            - commands
            - credentials
            - locations
            - sessions
            - tariffs
            - tokens
        - type: string
      description: The identifier of an OCPI module.
    VersionNumber:
      anyOf:
        - type: string
          enum:
            - "2.0"
            - "2.1"
            - "2.1.1"
        - type: string
      description: List of known OCPI version numbers.
