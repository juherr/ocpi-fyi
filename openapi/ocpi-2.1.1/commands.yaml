openapi: 3.1.0
info:
  title: OCPI 2.1.1 - Commands
  description: The Commands module enables remote commands from eMSP to CPO, such
    as starting/stopping sessions, reservations, and unlocking connectors. Uses
    async callbacks via response_url.
  version: 2.1.1
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
externalDocs:
  description: OCPI 2.1.1 Specification
  url: https://github.com/ocpi/ocpi
servers:
  - url: https://example.com/ocpi/2.1.1
    description: Example OCPI server
security:
  - TokenAuth: []
paths:
  /commands/RESERVE_NOW:
    post:
      operationId: postReserveNow
      summary: Reserve Now (CPO Interface)
      description: Request the Charge Point to reserve an EVSE for a Token.
      tags:
        - Commands - CPO Interface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveNow"
      responses:
        "200":
          description: Command request accepted by CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "401":
          description: Unauthorized.
      callbacks:
        commandResult:
          "{$request.body#/response_url}":
            post:
              summary: Async result from Charge Point
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CommandResponse"
              responses:
                "200":
                  description: Result received.
                  content:
                    application/json:
                      schema:
                        $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
                "400":
                  description: Invalid callback payload.
  /commands/START_SESSION:
    post:
      operationId: postStartSession
      summary: Start Session (CPO Interface)
      description: Request the Charge Point to start a transaction on the given EVSE/Connector.
      tags:
        - Commands - CPO Interface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSession"
      responses:
        "200":
          description: Command request accepted by CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "401":
          description: Unauthorized.
      callbacks:
        commandResult:
          "{$request.body#/response_url}":
            post:
              summary: Async result from Charge Point
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CommandResponse"
              responses:
                "200":
                  description: Result received.
                  content:
                    application/json:
                      schema:
                        $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
                "400":
                  description: Invalid callback payload.
  /commands/STOP_SESSION:
    post:
      operationId: postStopSession
      summary: Stop Session (CPO Interface)
      description: Request the Charge Point to stop an ongoing session.
      tags:
        - Commands - CPO Interface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopSession"
      responses:
        "200":
          description: Command request accepted by CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "401":
          description: Unauthorized.
      callbacks:
        commandResult:
          "{$request.body#/response_url}":
            post:
              summary: Async result from Charge Point
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CommandResponse"
              responses:
                "200":
                  description: Result received.
                  content:
                    application/json:
                      schema:
                        $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
                "400":
                  description: Invalid callback payload.
  /commands/UNLOCK_CONNECTOR:
    post:
      operationId: postUnlockConnector
      summary: Unlock Connector (CPO Interface)
      description: Request the Charge Point to unlock the connector. This functionality
        is for help desk operators only.
      tags:
        - Commands - CPO Interface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockConnector"
      responses:
        "200":
          description: Command request accepted by CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "401":
          description: Unauthorized.
      callbacks:
        commandResult:
          "{$request.body#/response_url}":
            post:
              summary: Async result from Charge Point
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CommandResponse"
              responses:
                "200":
                  description: Result received.
                  content:
                    application/json:
                      schema:
                        $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
                "400":
                  description: Invalid callback payload.
webhooks:
  commandResult:
    post:
      operationId: postCommandResult
      summary: Receive async CommandResult (eMSP Interface)
      description: The eMSP interface implements this webhook to receive the
        async CommandResult from the CPO via POST to the response_url provided
        in the original command request.
      tags:
        - Commands - eMSP Interface
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandResponse"
      responses:
        "200":
          description: Result received.
          content:
            application/json:
              schema:
                $ref: ./shared/common.yaml#/components/schemas/OcpiResponse
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed in the Authorization header.
  schemas:
    CommandEnvelopeResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/CommandResponse"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
      additionalProperties: true
    ReserveNow:
      type: object
      description: Request to reserve an EVSE for a Token.
      required:
        - response_url
        - token
        - expiry_date
        - reservation_id
        - location_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to. This URL
            might contain a unique ID to distinguish between ReserveNow requests.
        token:
          $ref: ./tokens.yaml#/components/schemas/Token
        expiry_date:
          $ref: ./shared/schemas/types.yaml#/components/schemas/DateTime
        reservation_id:
          type: integer
          description: Reservation id, unique for this reservation. If the Charge
            Point already has a reservation that matches this reservation_id the
            Charge Point will replace the reservation.
        location_id:
          type: string
          maxLength: 39
          description: Location.id of the Location (belonging to the CPO this
            request is sent to) for which to reserve an EVSE.
        evse_uid:
          type: string
          maxLength: 39
          description: Optional EVSE.uid of the EVSE of this Location if a specific
            EVSE has to be reserved.
      additionalProperties: true
      example:
        response_url: https://example.com/ocpi/emsp/2.1.1/commands/RESERVE_NOW/1234
        token:
          uid: "012345678"
          type: RFID
          auth_id: DE8ACC12E46L89
          issuer: TheNewMotion
          valid: true
          whitelist: ALLOWED
          last_updated: "2018-12-10T17:16:15Z"
        expiry_date: "2018-12-11T17:00:00Z"
        reservation_id: 1234
        location_id: LOC1
        evse_uid: "3256"
    StartSession:
      type: object
      description: Request to start a charging session.
      required:
        - response_url
        - token
        - location_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to. This URL
            might contain a unique ID to distinguish between StartSession requests.
        token:
          $ref: ./tokens.yaml#/components/schemas/Token
        location_id:
          type: string
          maxLength: 39
          description: Location.id of the Location (belonging to the CPO this
            request is sent to) on which a session is to be started.
        evse_uid:
          type: string
          maxLength: 39
          description: Optional EVSE.uid of the EVSE of this Location on which a
            session is to be started.
      additionalProperties: true
      example:
        response_url: https://example.com/ocpi/emsp/2.1.1/commands/START_SESSION/4321
        token:
          uid: "012345678"
          type: RFID
          auth_id: DE8ACC12E46L89
          issuer: TheNewMotion
          valid: true
          whitelist: ALLOWED
          last_updated: "2018-12-10T17:16:15Z"
        location_id: LOC1
        evse_uid: "3256"
    StopSession:
      type: object
      description: Request to stop an ongoing charging session.
      required:
        - response_url
        - session_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to. This URL
            might contain a unique ID to distinguish between StopSession requests.
        session_id:
          type: string
          maxLength: 36
          description: Session.id of the Session that is requested to be stopped.
      additionalProperties: true
      example:
        response_url: https://example.com/ocpi/emsp/2.1.1/commands/STOP_SESSION/1
        session_id: "1234"
    UnlockConnector:
      type: object
      description: Request to unlock a connector (for help desk operators).
      required:
        - response_url
        - location_id
        - evse_uid
        - connector_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to. This URL
            might contain a unique ID to distinguish between UnlockConnector requests.
        location_id:
          type: string
          maxLength: 39
          description: Location.id of the Location (belonging to the CPO this
            request is sent to) of which it is requested to unlock the connector.
        evse_uid:
          type: string
          maxLength: 39
          description: EVSE.uid of the EVSE of this Location of which it is
            requested to unlock the connector.
        connector_id:
          type: string
          maxLength: 36
          description: Connector.id of the Connector of this Location of which it
            is requested to unlock.
      additionalProperties: true
      example:
        response_url: https://example.com/ocpi/emsp/2.1.1/commands/UNLOCK_CONNECTOR/2
        location_id: LOC1
        evse_uid: "3256"
        connector_id: "1"
    CommandResponse:
      type: object
      description: Immediate response from CPO indicating whether the command was
        understood and forwarded (not the result from the Charge Point itself).
      required:
        - result
      properties:
        result:
          $ref: "#/components/schemas/CommandResponseType"
      additionalProperties: true
      example:
        result: ACCEPTED
    CommandResponseType:
      type: string
      enum:
        - NOT_SUPPORTED
        - REJECTED
        - ACCEPTED
        - TIMEOUT
        - UNKNOWN_SESSION
      x-enumDescriptions:
        NOT_SUPPORTED: The requested command is not supported by this CPO, Charge Point, EVSE etc.
        REJECTED: Command request rejected by the CPO or Charge Point.
        ACCEPTED: Command request accepted by the CPO or Charge Point.
        TIMEOUT: Command request timeout, no response received from the Charge Point in an reasonable time.
        UNKNOWN_SESSION: The Session in the requested command is not known by this CPO.
      description: Result of the command request.
