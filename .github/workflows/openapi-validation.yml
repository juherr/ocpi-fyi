name: OpenAPI Validation

on:
  push:
    paths:
      - 'openapi/**'
      - '.spectral.yaml'
      - 'redocly.yaml'
      - 'redocly-components.yaml'
      - 'openapitools.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check_openapi.sh'
      - 'scripts/publish_pr.sh'
      - 'tools/**'
      - '.github/workflows/openapi-validation.yml'
  pull_request:
    paths:
      - 'openapi/**'
      - '.spectral.yaml'
      - 'redocly.yaml'
      - 'redocly-components.yaml'
      - 'openapitools.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check_openapi.sh'
      - 'scripts/publish_pr.sh'
      - 'tools/**'
      - '.github/workflows/openapi-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run OpenAPI checks
        run: npm run validate:openapi
